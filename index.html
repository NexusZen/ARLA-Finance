<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arla BD FLIT • Interactive 3D Treasury</title>
  <meta name="description"
    content="Experience the interactive 3D Arla BD FLIT vault. Rotate the euro stack, withdraw authentic ARLA notes, and enjoy curated financial wit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Ambient background glow layers -->
  <div class="ambient-glow glow-emerald"></div>
  <div class="ambient-glow glow-gold"></div>

  <!-- Header: ARLA logo at top center, bigger, with ARLA FINANCE underneath -->
  <header class="navbar-center">
    <div class="top-center-brand">
      <img src="/arla_logo.png" alt="ARLA Logo" class="brand-logo-large" />
      <h1 class="brand-title">Arla BD FLIT</h1>
    </div>

    <div class="nav-controls-pinned">
      <button id="btn-sound" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
        <svg id="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="icon-sound-off" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
      <button id="btn-reset-view" class="icon-btn" title="Reset Camera View" aria-label="Reset Camera View">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- 3D Canvas Stage -->
  <main class="stage-container">
    <!-- Centered luminous glow aura directly behind the 3D money model -->
    <div class="model-center-glow"></div>

    <div id="canvas-container"></div>

    <!-- Loading Screen -->
    <div id="loader" class="loader-overlay">
      <div class="loader-card">
        <!-- Stacked logo fill: grey base + colored overlay clipped by progress -->
        <div class="loader-logo-stack">
          <img src="/arla_logo_GREY.png" alt="ARLA Loading" class="loader-logo-grey" />
          <div class="loader-logo-color-mask" id="loader-color-mask">
            <img src="/arla_logo.png" alt="ARLA" class="loader-logo-color" />
          </div>
        </div>
        <p id="loader-text" class="loader-text">Loading...</p>
      </div>
    </div>

    <!-- Underneath Controls Dock: Only "Click here to start the quiz" button -->
    <section class="bottom-dock">
      <button id="btn-click-money" class="btn-money" aria-label="Click here to start the quiz">
        <span class="btn-glow"></span>
        <span class="btn-shimmer"></span>
        <img src="/moneybag.png" alt="Money Bag" class="btn-moneybag-icon" />
        <span class="btn-text">Click here for free money</span>
        <span class="btn-arrow">→</span>
      </button>
    </section>
  </main>

  <!-- Quiz Modal -->
  <div id="quiz-modal" class="quiz-modal hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>

    <div class="quiz-presentation-wrapper" id="quiz-presentation">

      <!-- Glowing aura behind the quiz card -->
      <div class="quiz-glow-wrapper">
        <div class="quiz-glow-aura"></div>

        <!-- Banknote Intro: emerges from stack, then transitions to quiz -->
        <div class="banknote-intro" id="banknote-intro">
          <img src="/arla_100_note.png" alt="ARLA 100 Euro Note" class="banknote-intro-img" />
          <div class="banknote-intro-shimmer"></div>
        </div>

        <!-- Quiz Card Panel (hidden during intro) -->
        <div class="quiz-card quiz-card-hidden" id="quiz-card">

          <!-- Progress bar -->
          <div class="quiz-progress-bar-wrapper">
            <div class="quiz-progress-bar" id="quiz-progress-bar"></div>
          </div>
          <div class="quiz-progress-label" id="quiz-progress-label">Question 1 of 5</div>

          <!-- Waiting area (shown when host has not started the quiz yet) -->
          <div class="quiz-waiting-area hidden" id="quiz-waiting-area">
            <div class="waiting-loader-rings">
              <div class="spinner-ring"></div>
              <div class="spinner-core"></div>
            </div>
            <h2 class="waiting-title">Please wait</h2>
            <p class="waiting-subtitle">The quiz will shortly start</p>
            <div class="waiting-dots-pulse">
              <span class="pulse-dot"></span>
              <span class="pulse-dot"></span>
              <span class="pulse-dot"></span>
            </div>
          </div>

          <!-- Question content area (shown during quiz) -->
          <div class="quiz-question-area" id="quiz-question-area">
            <h2 class="quiz-question-number" id="quiz-question-number">01</h2>
            <p class="quiz-question-text" id="quiz-question-text">Loading question...</p>
            <div class="quiz-options" id="quiz-options">
              <!-- Options are injected by JS -->
            </div>
          </div>

          <!-- Congratulations area (shown after quiz ends) -->
          <div class="quiz-congrats-area hidden" id="quiz-congrats-area">
            <div class="congrats-icon">🎉</div>
            <h2 class="congrats-title" id="congrats-title">Congratulations!!</h2>
            <p class="congrats-subtitle" id="congrats-subtitle">You passed the test.</p>
            <p class="congrats-body" id="congrats-body">You are now officially eligible to become a Finance Team Member.
            </p>
            <button id="btn-close-quiz" class="action-btn btn-quiz-close" aria-label="Return to stack">
              Return to Stack
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
